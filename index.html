<style>
  :root {
    --navy: #0e2238; --navy-2: #173a5c; --oro: #e8b04a;
    --tinta: #14202e; --suave: #607080; --raya: rgba(20, 32, 46, .09); --fondo: #f3f5f8; --panel: #ffffff; --hover: rgba(20, 32, 46, .05);
    --sombra: 0 -12px 40px rgba(10, 25, 45, .20); --arriba: env(safe-area-inset-top, 0px); --abajo: env(safe-area-inset-bottom, 0px);
    --barra: 60px; --h: 46vh;
  }
  body[data-tema="oscuro"] { --tinta: #eaf0f7; --suave: #9db0c4; --raya: rgba(255, 255, 255, .10); --fondo: #1a2636; --panel: #101b2a; --hover: rgba(255, 255, 255, .07);
                             --sombra: 0 -12px 40px rgba(0, 0, 0, .55); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { margin: 0; overflow: hidden; color: var(--tinta); background: #dfe6ee; -webkit-font-smoothing: antialiased;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }   /* la letra del teléfono: no hay que descargar nada */
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
  .tabular { font-variant-numeric: tabular-nums; }
  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ------------------------------------------------------------------ mapa */
  #mapa { position: fixed; inset: 0; z-index: 0; background: #dfe6ee; }
  .leaflet-tile-pane { filter: saturate(.5) brightness(1.04); transition: filter .4s ease; }
  body[data-tema="oscuro"]:not(.satelite) .leaflet-tile-pane { filter: invert(1) hue-rotate(185deg) saturate(.5) brightness(.82); }
  body.satelite .leaflet-tile-pane { filter: brightness(.88); }
  .leaflet-control-attribution { font-size: 9px; background: rgba(255, 255, 255, .65) !important; border-radius: 6px 0 0 0; }
  .ruta { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
  .pin { display: grid; place-items: center; width: max-content; transform: translate(-50%, -50%); min-width: 28px; height: 28px; padding: 0 9px; border-radius: 14px;
         color: #fff; font-weight: 800; font-size: 12.5px; background: var(--c); border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(0, 0, 0, .35); white-space: nowrap; }
  .yo { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 7px rgba(26, 115, 232, .22); }

  /* ----------------------------------------------------------------- barra */
  .barra { position: fixed; z-index: 500; top: 0; left: 0; right: 0; height: calc(var(--barra) + var(--arriba)); padding: var(--arriba) 14px 0; display: flex; align-items: center; gap: 11px;
           color: #fff; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); box-shadow: 0 6px 22px rgba(10, 25, 45, .28); }
  .barra::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--oro), rgba(232, 176, 74, 0) 70%); }
  .barra img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 12px; padding: 3px; flex: none; box-shadow: 0 4px 10px rgba(0, 0, 0, .25); }
  .barra div { min-width: 0; flex: 1; }
  .barra small { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--oro); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra h1 { margin: 1px 0 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
  #b-instalar { display: none; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; background: var(--oro); color: #1c1400; font-weight: 800; font-size: 12.5px; }
  #b-instalar svg { width: 16px; height: 16px; }

  /* ---------------------------------------------------------- botones flotantes */
  .fabs { position: fixed; z-index: 450; right: 12px; bottom: calc(var(--h) + 14px); display: flex; flex-direction: row; gap: 8px; transition: bottom .34s cubic-bezier(.2, .8, .2, 1), opacity .25s ease; }
  body.arrastrando .fabs { transition: none; }
  body.hoja-llena .fabs { opacity: 0; pointer-events: none; }
  #b-capa { display: none !important; }
  .fab { height: 50px; padding: 0 18px 0 14px; gap: 8px; font-size: 15.5px; font-weight: 800; display: flex !important; align-items: center; white-space: nowrap;
         width: auto; border-radius: 25px; background: var(--panel); color: var(--tinta); display: grid; place-items: center; box-shadow: 0 8px 22px rgba(10, 25, 45, .24); transition: transform .15s ease; }
  .fab:active { transform: scale(.93); }
  .fab.activo { background: var(--navy); color: #fff; }
  body[data-tema="oscuro"] .fab.activo { background: var(--oro); color: #1c1400; }

  /* ------------------------------------------------------------------ hoja */
  .hoja { position: fixed; z-index: 600; left: 0; right: 0; bottom: 0; height: var(--h); background: var(--panel); border-radius: 24px 24px 0 0; box-shadow: var(--sombra);
          display: flex; flex-direction: column; transition: height .34s cubic-bezier(.2, .8, .2, 1), background .3s ease; will-change: height; }
  body.arrastrando .hoja { transition: none; }
  .agarre { flex: none; padding: 9px 0 3px; display: grid; place-items: center; touch-action: none; cursor: grab; }
  .agarre i { width: 44px; height: 5px; border-radius: 5px; background: var(--raya); box-shadow: inset 0 0 0 5px rgba(120, 135, 150, .35); }
  .vista { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cab { flex: none; padding: 4px 16px 10px; touch-action: none; }
  .cab-fila { display: flex; align-items: baseline; gap: 10px; }
  .cab h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; flex: 1; }
  .cab .sub { font-size: 12.5px; color: var(--suave); font-weight: 600; white-space: nowrap; }
  .buscar { position: relative; margin-top: 10px; }
  .buscar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--suave); width: 18px; height: 18px; }
  .buscar input { width: 100%; height: 50px; border-radius: 15px; border: 1px solid transparent; background: var(--fondo); padding: 0 14px 0 42px; font-size: 16px; font-weight: 600; outline: none; }
  .buscar input:focus { border-color: var(--oro); }
  .buscar input::placeholder { color: var(--suave); font-weight: 500; }
  .cuerpo { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px calc(14px + var(--abajo)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: thin; }

  .linea { position: relative; display: grid; grid-template-columns: 46px 1fr auto 16px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 8px; border-radius: 16px;
           transition: background .15s ease, transform .15s ease; animation: sube .45s cubic-bezier(.2, .8, .2, 1) backwards; }
  .linea:hover { background: var(--hover); }
  .linea:active { background: var(--hover); transform: scale(.985); }
  .linea + .linea::before { content: ""; position: absolute; left: 66px; right: 8px; top: 0; height: 1px; background: var(--raya); }
  @keyframes sube { from { opacity: 0; transform: translateY(10px); } }
  .chip { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 21px;
          background: linear-gradient(150deg, color-mix(in srgb, var(--c) 74%, #fff), var(--c) 65%); box-shadow: 0 7px 16px color-mix(in srgb, var(--c) 38%, transparent); }
  .l-txt { min-width: 0; }
  .l-nombre { font-weight: 800; font-size: 17.5px; }
  .l-sub { font-size: 14.5px; color: var(--suave); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l-cerca { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--c) 15%, transparent); color: color-mix(in srgb, var(--c) 72%, var(--tinta)); }
  .l-km { text-align: right; font-weight: 800; font-size: 15px; white-space: nowrap; }
  .l-km small { display: block; font-size: 11.5px; color: var(--suave); font-weight: 600; margin-top: 1px; }
  .linea > svg { width: 16px; height: 16px; color: var(--suave); opacity: .6; }
  .vacio { padding: 30px 18px; text-align: center; color: var(--suave); font-size: 14px; line-height: 1.5; font-weight: 500; }

  /* ----------------------------------------------------------------- ficha */
  .f-cab { flex: none; display: flex; align-items: center; gap: 12px; padding: 2px 14px 12px; touch-action: none; }
  .volver { width: 40px; height: 40px; border-radius: 13px; background: var(--fondo); display: grid; place-items: center; flex: none; }
  .f-cab .chip { width: 44px; height: 44px; font-size: 17px; border-radius: 14px; }
  .f-cab h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-cab p { margin: 1px 0 0; font-size: 12.5px; color: var(--suave); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-cab > div { min-width: 0; flex: 1; }
  .insignia { flex: none; font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 99px; background: color-mix(in srgb, var(--c) 15%, transparent); color: color-mix(in srgb, var(--c) 72%, var(--tinta)); white-space: nowrap; }
  .cifras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 2px 4px 14px; }
  .cifras div { padding: 12px 12px 11px; border-radius: 16px; background: var(--fondo); }
  .cifras b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .cifras b i { font-style: normal; font-size: 12px; color: var(--suave); margin-left: 3px; letter-spacing: 0; }
  .cifras span { display: block; font-size: 14px; color: var(--suave); font-weight: 600; margin-top: 4px; }
  .recorrido { margin: 0 4px 14px; padding: 4px 14px; border-radius: 16px; border: 1px solid var(--raya); }
  .parada { display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; font-size: 14px; font-weight: 700; position: relative; }
  .parada + .parada { border-top: 1px solid var(--raya); }
  .parada i { width: 14px; height: 14px; border-radius: 50%; border: 3.5px solid var(--c); background: var(--panel); justify-self: center; }
  .parada.fin i { background: var(--c); }
  .parada small { display: block; font-size: 11.5px; color: var(--suave); font-weight: 600; margin-top: 1px; }
  .parada span { color: var(--suave); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 4px 12px; }
  .boton { min-height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15.5px; background: var(--navy); color: #fff;
           text-decoration: none; transition: transform .15s ease; }
  .boton:active { transform: scale(.97); }

<script src="rutas_datos.js" onerror="void 0"></script>
<script>
const CAMIRI = [-20.04, -63.52];
const PALETA = ["#e5484d", "#3b7bf6", "#12a594", "#8e4ec6", "#f5a524", "#0ea5c6", "#e93d82", "#5b6ad0", "#65a30d", "#b45309"];
const $ = id => document.getElementById(id);
const datos = window.RUTAS_CAMIRI || { rutas: [], lineas: {} };
const num = (v, dec) => v == null || !isFinite(v) ? "–" : v.toLocaleString("es-BO", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const lineaDe = nombre => nombre.replace(/\s*-\s*(Ida|Vuelta)$/, "");
const tramoDe = nombre => (nombre.match(/-\s*(Ida|Vuelta)$/) || [])[1] || "";
const sinTildes = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const lateral = window.matchMedia("(min-width: 760px), (orientation: landscape) and (min-width: 600px)");
const calmo = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const FLECHA = '<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';

let seleccion = null, marcaYo = null, miPunto = null, ficha = 0;

// ------------------------------------------------------------------ datos
const grupos = new Map();
for (const r of datos.rutas || []) {
  const base = lineaDe(r.nombre);
  if (!grupos.has(base)) grupos.set(base, { nombre: base, tramos: [] });
  grupos.get(base).tramos.push(r);
}
const lineas = [...grupos.values()].sort((a, b) => a.nombre.localeCompare(b.nombre, "es", { numeric: true }));
lineas.forEach((l, i) => {
  const propio = (datos.lineas || {})[l.nombre] || {};
  l.color = PALETA[i % PALETA.length];
  l.numero = (l.nombre.match(/(\d+)/) || [])[1] || String(i + 1);
  l.ida = l.tramos.find(t => tramoDe(t.nombre) === "Ida");
  l.vuelta = l.tramos.find(t => tramoDe(t.nombre) === "Vuelta");
  l.orden = [l.ida, l.vuelta, ...l.tramos.filter(t => !tramoDe(t.nombre))].filter(Boolean);
  l.km = l.tramos.reduce((s, t) => s + t.km, 0);
  l.min = l.tramos.every(t => t.min) ? l.tramos.reduce((s, t) => s + t.min, 0) : null;
  l.vel = l.min ? l.km / (l.min / 60) : null;
  l.titulo = propio.alias || l.nombre;
  l.destino = (l.tramos.find(t => t.destino) || {}).destino || "";
  l.detalle = propio.detalle || (l.destino && datos.salida ? datos.salida + " → " + l.destino : l.destino);
  l.tipo = l.ida && l.vuelta ? "Ida y vuelta" : !l.ida && !l.vuelta ? "Vuelta completa" : "Recorrido";
  l.busca = sinTildes(l.titulo + " " + l.detalle + " linea " + l.numero);
  l.inicio = l.orden[0].pts[0];
});
if (datos.entidad) { $("t-entidad").textContent = datos.entidad; document.querySelector("#entrada span").textContent = datos.entidad; }

// ------------------------------------------------------------------- tema
const oscuro = window.matchMedia("(prefers-color-scheme: dark)");
const ponerTema = () => { document.body.dataset.tema = oscuro.matches ? "oscuro" : "claro"; };
ponerTema();
oscuro.addEventListener("change", ponerTema);

// ------------------------------------------------------------------- mapa
const mapa = L.map("mapa", { zoomControl: false }).setView(CAMIRI, 14);
const calles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Mapa &copy; Esri" }).addTo(mapa);
const satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 17, attribution: "Imágenes &copy; Esri" });
const capaRutas = L.layerGroup().addTo(mapa), capaMarcas = L.layerGroup().addTo(mapa);
const capas = new Map();

// Adapta el dibujo del recorrido a las paradas corregidas a mano. "grabado" es la grabación original, que no se toca.
function masCercano(pts, p, desde, hasta) {
  let mejor = Infinity, k = desde;
  for (let i = desde; i < hasta; i++) { const d = mapa.distance(pts[i], p); if (d < mejor) { mejor = d; k = i; } }
  return k;
}
function adaptarRecorrido(l) {
  const s = (datos.paradas || {})[l.nombre + "|salida"], r = (datos.paradas || {})[l.nombre + "|regreso"];
  if (l.ida && l.vuelta) {
    let ida = l.ida.grabado, vuelta = l.vuelta.grabado;
    if (s) {                                   // la ida arranca en la parada corregida y la vuelta termina en ella
      ida = [s, ...ida.slice(masCercano(ida, s, 0, Math.ceil(ida.length * .3)))];
      vuelta = [...vuelta.slice(0, masCercano(vuelta, s, Math.floor(vuelta.length * .7), vuelta.length) + 1), s];
    }
    if (r) {                                   // lo mismo en el otro extremo
      ida = [...ida.slice(0, masCercano(ida, r, Math.floor(ida.length * .7), ida.length) + 1), r];
      vuelta = [r, ...vuelta.slice(masCercano(vuelta, r, 0, Math.ceil(vuelta.length * .3)))];
    }
    l.ida.pts = ida;
    l.vuelta.pts = vuelta;
  } else if (s) {
    const t = l.orden[0], g = t.grabado, n = g.length;
    if (mapa.distance(g[0], g[n - 1]) < 150) {          // circuito: empieza y termina en la parada, entrando por su punto más cercano
      const i = masCercano(g, s, 0, n);
      t.pts = [s, ...g.slice(i), ...g.slice(0, i + 1), s];
    } else t.pts = [s, ...g.slice(masCercano(g, s, 0, Math.ceil(n * .3)))];
  }
}
for (const l of lineas) { for (const t of l.tramos) t.grabado = t.pts; adaptarRecorrido(l); }

// primero todos los bordes claros y después las rutas, para que un borde no tape otra ruta
for (const l of lineas) for (const t of l.tramos)
  capas.set(t.nombre, { borde: L.polyline(t.pts, { color: "#fff", weight: 8, opacity: .9, interactive: false, lineCap: "round", lineJoin: "round" }).addTo(capaRutas) });
for (const l of lineas) for (const t of l.tramos) {
  const linea = L.polyline(t.pts, { color: l.color, weight: 4.5, opacity: .97, className: "ruta", lineCap: "round", lineJoin: "round",
    dashArray: tramoDe(t.nombre) === "Vuelta" ? "10 9" : null }).addTo(capaRutas);
  linea.on("click", () => elegir(l.nombre));
  capas.get(t.nombre).linea = linea;
}

// Dónde se toma cada línea. Ida y vuelta: una parada en cada extremo. Vuelta completa: una sola.
function paradasDe(l) {
  // si la parada se corrigió a mano en la presentación, vale esa posición
  const corregida = tipo => (datos.paradas || {})[l.nombre + "|" + tipo];
  const lista = [{ linea: l, p: corregida("salida") || l.inicio, zona: datos.salida, salida: true }];
  if (l.ida && l.vuelta) lista.push({ linea: l, p: corregida("regreso") || l.vuelta.pts[0], zona: l.destino, salida: false });
  return lista;
}
// De lejos los números se enciman: se agrupan en un rótulo por zona. Al tocarlo, el mapa se acerca y aparece cada parada.
function pinesGenerales() {
  const paradas = lineas.flatMap(paradasDe), px = paradas.map(q => mapa.latLngToContainerPoint(q.p)), grupos = [];
  paradas.forEach((q, i) => {
    const g = grupos.find(g => g.some(j => Math.hypot(px[j].x - px[i].x, px[j].y - px[i].y) < 28));
    if (g) g.push(i); else grupos.push([i]);
  });
  for (const g of grupos) {
    const suyas = g.map(i => paradas[i]);
    if (suyas.length === 1) { pin(suyas[0].p, suyas[0].linea.numero, suyas[0].linea.color, () => elegir(suyas[0].linea.nombre)); continue; }
    const centro = [suyas.reduce((t, q) => t + q.p[0], 0) / suyas.length, suyas.reduce((t, q) => t + q.p[1], 0) / suyas.length];
    const nombres = [...new Set(suyas.map(q => q.zona).filter(Boolean))];
    const numeros = [...new Set(suyas.map(q => q.linea.numero))];
    const texto = numeros.length <= 3 ? (numeros.length === 1 ? "Línea " : "Líneas ") + numeros.join(numeros.length === 2 ? " y " : ", ")
      : (nombres.length === 1 ? nombres[0] + " · " : "") + suyas.length + " paradas";
    pin(centro, texto, "#0e2238",
      () => mapa.flyToBounds(L.latLngBounds(suyas.map(q => q.p)).pad(.35), { ...margen(), maxZoom: 18, duration: calmo ? 0 : .8 }));
  }
}
function pin(p, texto, color, alTocar) {
  const m = L.marker(p, { interactive: !!alTocar, keyboard: false, icon: L.divIcon({ className: "", iconSize: [0, 0], html: '<div class="pin"></div>' }) }).addTo(capaMarcas);
  const caja = m.getElement().firstChild;
  caja.textContent = texto;
  caja.style.setProperty("--c", color);
  if (alTocar) { caja.style.cursor = "pointer"; caja.style.pointerEvents = "auto"; m.on("click", alTocar); }
}
mapa.on("zoomend", () => { if (!seleccion && lineas.length) { capaMarcas.clearLayers(); pinesGenerales(); } });
function margen() {
  const arriba = $("hoja").getBoundingClientRect();
  if (lateral.matches) return { paddingTopLeft: [arriba.right + 30, 90], paddingBottomRight: [80, 40] };
  return { paddingTopLeft: [34, 96], paddingBottomRight: [34, Math.min(alturaActual(), window.innerHeight * .5) + 30] };
}
function encuadrar(pts, animado = true) {
  if (!pts.length) return;
  const opciones = { ...margen(), maxZoom: 16 };
  if (animado && !calmo) mapa.flyToBounds(L.latLngBounds(pts), { ...opciones, duration: .85 });
  else mapa.fitBounds(L.latLngBounds(pts), { ...opciones, animate: false });
}

// --------------------------------------------- la hoja: se arrastra y se queda en tres alturas
const paradas = () => [138, Math.round(window.innerHeight * .46), window.innerHeight - 78];
let alturaPx = 0;
const alturaActual = () => lateral.matches ? 0 : alturaPx;
function ponerAltura(px, sinMover = false) {
  const p = paradas();
  alturaPx = Math.max(p[0], Math.min(p[2], px));
  document.documentElement.style.setProperty("--h", alturaPx + "px");
  document.body.classList.toggle("hoja-llena", alturaPx > p[1] + 60);
  if (sinMover) document.body.classList.add("arrastrando"); else document.body.classList.remove("arrastrando");
}
function alturaCercana(px) { return paradas().reduce((a, b) => Math.abs(b - px) < Math.abs(a - px) ? b : a); }
let arrastre = null;
function alTocar(e) {
  if (lateral.matches || e.target.closest("button, input, a")) return;
  arrastre = { y: e.clientY, h: alturaPx, movio: false, id: e.pointerId };
}
function alMover(e) {
  if (!arrastre) return;
  const d = arrastre.y - e.clientY;
  if (Math.abs(d) > 4) arrastre.movio = true;
  if (arrastre.movio) ponerAltura(arrastre.h + d, true);
}
function alSoltar(e) {
  if (!arrastre) return;
  const d = arrastre.y - e.clientY, p = paradas();
  let destino;
  if (!arrastre.movio) destino = e.target.closest("#agarre") ? p[(p.indexOf(alturaCercana(alturaPx)) + 1) % 3] : alturaPx;   // un toque en el asa pasa a la siguiente altura
  else if (Math.abs(d) > 60) destino = d > 0 ? p.find(x => x > arrastre.h + 10) || p[2] : [...p].reverse().find(x => x < arrastre.h - 10) || p[0];
  else destino = alturaCercana(alturaPx);
  arrastre = null;
  ponerAltura(destino);
  setTimeout(reencuadrar, 360);
}
document.querySelectorAll(".arrastre").forEach(z => z.addEventListener("pointerdown", alTocar));
window.addEventListener("pointermove", alMover);
window.addEventListener("pointerup", alSoltar);
window.addEventListener("pointercancel", () => { if (arrastre) { arrastre = null; ponerAltura(alturaCercana(alturaPx)); } });

// ------------------------------------------------------------------ lista
function metrosA(l) {                      // distancia de mi ubicación al punto más cercano de la línea
  if (!miPunto) return null;
  let mejor = Infinity;
  for (const t of l.tramos) for (let i = 0; i < t.pts.length; i += 3) mejor = Math.min(mejor, mapa.distance(miPunto, t.pts[i]));
  return mejor;
}
function pintarLista() {
  const texto = sinTildes($("buscar").value.trim()), caja = $("lista");
  let lista = lineas.filter(l => !texto || l.busca.includes(texto));
  if (miPunto) lista = lista.map(l => ({ l, d: metrosA(l) })).sort((a, b) => a.d - b.d).map(x => Object.assign(x.l, { cerca: x.d }));
  $("l-sub").textContent = miPunto ? "Ordenadas por cercanía" : datos.salida ? "Salen de " + datos.salida : lineas.length + " líneas";
  caja.innerHTML = "";
  if (!lineas.length) { caja.innerHTML = '<div class="vacio">Todavía no hay rutas publicadas.</div>'; return; }
  if (!lista.length) { caja.innerHTML = '<div class="vacio">Ninguna línea coincide con esa búsqueda.</div>'; return; }
  lista.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "linea";
    b.style.setProperty("--c", l.color);
    b.style.animationDelay = Math.min(i, 9) * 28 + "ms";
    b.innerHTML = `<span class="chip"></span><span class="l-txt"><div class="l-nombre"></div><div class="l-sub"></div></span>
      <span class="l-km tabular">${num(l.km, 1)} km<small>${l.min ? num(l.min, 0) + " min" : ""}</small></span>${FLECHA}`;
    b.querySelector(".chip").textContent = l.numero;
    b.querySelector(".l-nombre").textContent = l.titulo;
    b.querySelector(".l-sub").textContent = l.destino ? "Va a " + l.destino : l.tipo;
    if (miPunto && l.cerca != null && l.cerca < 5000) {
      const c = document.createElement("span");
      c.className = "l-cerca";
      c.textContent = l.cerca < 1000 ? `Pasa a ${num(l.cerca, 0)} m` : `Pasa a ${num(l.cerca / 1000, 1)} km`;
      b.querySelector(".l-txt").appendChild(c);
    }
    b.addEventListener("click", () => elegir(l.nombre));
    caja.appendChild(b);
  });
}

// ------------------------------------------------------------------ ficha
function pintarFicha(l) {
  $("f-chip").textContent = l.numero;
  $("f-chip").style.setProperty("--c", l.color);
  $("f-titulo").textContent = l.titulo;
  $("f-sub").textContent = l.detalle || "Recorrido de la línea";
  $("f-tipo").textContent = l.tipo === "Vuelta completa" ? "Da la vuelta" : l.tipo;
  $("f-tipo").style.setProperty("--c", l.color);
  const caja = $("ficha");
  caja.style.setProperty("--c", l.color);
  caja.scrollTop = 0;
  const salida = datos.salida || "Inicio", circuito = l.tipo === "Vuelta completa";
  const fila = (clase, nombre, sub, valor) => `<div class="parada ${clase}"><i></i><div>${nombre}<small>${sub}</small></div><span class="tabular">${valor}</span></div>`;
  let recorrido = fila("", "", "Punto de salida", "");
  if (circuito) recorrido += fila("fin", "", l.destino ? "Da la vuelta y regresa a " + salida + ", sin cambiar de micro" : "Vuelta completa, sin cambiar de micro",
    `${num(l.km, 1)} km · ${l.min ? num(l.min, 0) + " min" : ""}`);
  else {
    if (l.ida) recorrido += fila("", "", "Fin de la ida · aquí se cambia de micro", `${num(l.ida.km, 1)} km · ${l.ida.min ? num(l.ida.min, 0) + " min" : ""}`);
    if (l.vuelta) recorrido += fila("fin", "", "Regreso", `${num(l.vuelta.km, 1)} km · ${l.vuelta.min ? num(l.vuelta.min, 0) + " min" : ""}`);
  }
  const p = l.inicio;
  caja.innerHTML = `<div class="fotos" id="f-fotos"></div><div class="cifras tabular">
      <div><b>${num(l.min, 0)}<i>min</i></b><span>dura el viaje</span></div>
      <div><b>${num(l.km, 1)}<i>km</i></b><span>de recorrido</span></div></div>
    <div class="recorrido">${recorrido}</div>
    <div class="acciones">
      ${paradasDe(l).map(q => `<a class="boton ir" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q.p[0]},${q.p[1]}&travelmode=walking">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg><span></span></a>`).join("")}
      <button class="boton claro" id="b-compartir"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.500"/><circle cx="18" cy="6" r="2.500"/><circle cx="18" cy="18" r="2.500"/><path d="M8.200 10.900l7.600-3.800M8.200 13.100l7.600 3.800"/></svg>Compartir</button>
    </div>
    <p class="nota">El tiempo se midió viajando en el micro. Puede tardar más o menos según la hora.</p>`;
  // los nombres se escriben como texto, no como HTML
  const nombres = caja.querySelectorAll(".parada > div");
  const textos = circuito ? [salida, l.destino || salida] : [salida, l.ida ? (l.destino || "Final de la ruta") : null, l.vuelta ? salida : null].filter(Boolean);
  nombres.forEach((n, i) => n.insertBefore(document.createTextNode(textos[i] || ""), n.firstChild));
  const dos = paradasDe(l).length > 1;
  caja.querySelectorAll(".boton.ir span").forEach((e, i) => { e.textContent = dos ? "Ir a " + (paradasDe(l)[i].zona || (i ? "la parada de regreso" : "la parada")) : "Cómo llegar a la parada"; });
  caja.querySelector(".acciones").classList.toggle("tres", dos);
  $("b-compartir").addEventListener("click", () => compartir(l));
  paradasDe(l).forEach((q, i) => {                 // fotos de la parada: solo aparecen si existen
    const b = document.createElement("button"), img = document.createElement("img"), pie = document.createElement("span");
    b.className = "foto";
    b.style.display = "none";
    b.setAttribute("aria-label", "Ver foto: " + nombreParada(q));
    img.alt = "";
    img.onload = () => { b.style.display = ""; };
    pie.textContent = nombreParada(q);
    b.append(img, pie);
    b.addEventListener("click", () => abrirVisor(l, i));
    $("f-fotos").appendChild(b);
    cargarFoto(img, q);
  });
}

async function compartir(l) {
  const url = location.href.split("#")[0] + "#linea-" + l.numero;
  const texto = `${l.titulo}${l.detalle ? " (" + l.detalle + ")" : ""}: ${num(l.km, 1)} km${l.min ? ", " + num(l.min, 0) + " min" : ""}. Micros de Camiri.`;
  try {
    if (navigator.share) await navigator.share({ title: "Micros de Camiri", text: texto, url });
    else { await navigator.clipboard.writeText(texto + " " + url); avisar("Enlace copiado."); }
  } catch (e) { /* el usuario cerró el cuadro de compartir */ }
}

// La ruta elegida se dibuja sola de principio a fin.
function trazar(l, turno) {
  if (calmo) return;
  let espera = 0;
  for (const t of l.orden) {
    const el = capas.get(t.nombre).linea.getElement();
    if (!el) continue;
    const largo = el.getTotalLength(), dur = Math.min(1500, 700 + t.km * 90);
    el.style.transition = "none";
    el.style.strokeDasharray = largo + " " + largo;
    el.style.strokeDashoffset = largo;
    setTimeout(() => {
      if (turno !== ficha) return;
      el.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(.5, 0, .2, 1)`;
      el.style.strokeDashoffset = 0;
      setTimeout(() => { if (turno === ficha) limpiarTrazo(el); }, dur + 60);
    }, espera + 30);
    espera += dur;
  }
}
function limpiarTrazo(el) { el.style.transition = ""; el.style.strokeDasharray = ""; el.style.strokeDashoffset = ""; }

function reencuadrar(animado = true) {
  const l = lineas.find(x => x.nombre === seleccion);
  encuadrar(l ? l.tramos.flatMap(t => t.pts) : lineas.flatMap(x => x.tramos.flatMap(t => t.pts)), animado);
}

function elegir(nombre, desdeHistorial = false) {
  const l = lineas.find(x => x.nombre === nombre) || null;
  seleccion = l ? l.nombre : null;
  const turno = ++ficha;
  document.body.classList.toggle("en-ficha", !!l);
  $("b-red").classList.toggle("activo", !l);
  capaMarcas.clearLayers();
  for (const x of lineas) for (const t of x.tramos) {
    const propia = !l || x === l, c = capas.get(t.nombre), el = c.linea.getElement();
    if (el) limpiarTrazo(el);
    c.linea.setStyle({ opacity: propia ? .97 : .13, weight: l && propia ? 6 : 4.5 });
    c.borde.setStyle({ opacity: propia ? .9 : 0, weight: l && propia ? 10.5 : 8 });
  }
  if (l) {
    for (const t of l.tramos) capas.get(t.nombre).borde.bringToFront();
    for (const t of l.tramos) capas.get(t.nombre).linea.bringToFront();
    pintarFicha(l);
    const primero = l.orden[0], fin = primero.pts[primero.pts.length - 1];
    paradasDe(l).forEach((q, i) => pin(q.p, "Parada " + (q.zona || (q.salida ? "de salida" : "de regreso")), l.color, () => abrirVisor(l, i)));
    if (!(l.ida && l.vuelta) && mapa.distance(primero.pts[0], fin) > 150) pin(fin, l.destino || "Fin del recorrido", l.color);
    if (!lateral.matches) ponerAltura(paradas()[1]);
    setTimeout(() => { if (turno === ficha) trazar(l, turno); }, calmo ? 0 : 950);
  } else {
    pinesGenerales();
  }
  if (!desdeHistorial) {                    // el botón "atrás" del teléfono vuelve a la lista en vez de cerrar la aplicación
    if (l) history.pushState({ linea: l.nombre }, "", "#linea-" + l.numero);
    else if (location.hash) history.pushState({}, "", location.pathname + location.search);
  }
  setTimeout(() => { if (turno === ficha) reencuadrar(); }, lateral.matches ? 0 : 60);
}
window.addEventListener("popstate", () => elegir(deHash(), true));
const deHash = () => { const m = location.hash.match(/^#linea-(\d+)/); const l = m && lineas.find(x => x.numero === m[1]); return l ? l.nombre : null; };


// ------------------------------------------------------------ fotos de las paradas
// Se buscan en la carpeta "fotos" por nombre: "linea 3" para una línea de vuelta completa;
// "linea 1 ida" (parada de salida) y "linea 1 vuelta" (parada de regreso) para las de ida y vuelta.
const EXT_FOTO = ["jpeg", "jpg", "png", "webp"];
function rutasFoto(q) {
  const n = q.linea.numero, idaVuelta = q.linea.ida && q.linea.vuelta;
  const bases = idaVuelta ? [`linea ${n} ${q.salida ? "ida" : "vuelta"}`].concat(q.salida ? [`linea ${n}`] : []) : [`linea ${n}`];
  return bases.flatMap(b => EXT_FOTO.map(e => "fotos/" + encodeURIComponent(b) + "." + e));
}
function cargarFoto(img, q, alFallar) {            // prueba cada nombre posible hasta que uno exista
  const lista = rutasFoto(q);
  let i = 0;
  img.onerror = () => { i++; if (i < lista.length) img.src = lista[i]; else { img.onerror = null; if (alFallar) alFallar(); } };
  img.src = lista[0];
}
const nombreParada = q => "Parada " + (q.zona || (q.salida ? "de salida" : "de regreso"));
let visor = null;
function abrirVisor(l, i) {
  const qs = paradasDe(l);
  i = (i + qs.length) % qs.length;
  visor = { l, i };
  const q = qs[i], img = $("v-img");
  $("v-titulo").textContent = l.titulo + " · " + nombreParada(q);
  $("v-sub").textContent = qs.length > 1 ? (q.salida ? "Parada de salida (ida) · 1 de 2" : "Parada de regreso (vuelta) · 2 de 2") : "Parada de salida";
  $("v-vacio").style.display = "none";
  img.style.display = "";
  img.classList.remove("lista");
  img.onload = () => img.classList.add("lista");
  cargarFoto(img, q, () => { img.style.display = "none"; $("v-vacio").style.display = "grid"; });
  $("v-ant").style.visibility = $("v-sig").style.visibility = qs.length > 1 ? "visible" : "hidden";
  $("visor").classList.add("abierto");
}
function cerrarVisor() { visor = null; $("visor").classList.remove("abierto"); }

let relojAviso = null;
function avisar(texto) {
  $("aviso").textContent = texto;
  $("aviso").classList.add("ver");
  clearTimeout(relojAviso);
  relojAviso = setTimeout(() => $("aviso").classList.remove("ver"), 4500);
}

// ----------------------------------------------------------------- botones
$("b-volver").addEventListener("click", () => elegir(null));
$("v-cerrar").addEventListener("click", cerrarVisor);
$("v-ant").addEventListener("click", () => visor && abrirVisor(visor.l, visor.i - 1));
$("v-sig").addEventListener("click", () => visor && abrirVisor(visor.l, visor.i + 1));
$("visor").addEventListener("click", e => { if (e.target.id === "visor") cerrarVisor(); });
document.addEventListener("keydown", e => { if (visor && e.key === "Escape") cerrarVisor(); });
$("b-red").addEventListener("click", () => elegir(null));
$("buscar").addEventListener("input", pintarLista);
$("buscar").addEventListener("focus", () => { if (!lateral.matches) ponerAltura(paradas()[2]); });
$("b-capa").addEventListener("click", () => {
  const aSatelite = !document.body.classList.contains("satelite");
  document.body.classList.toggle("satelite", aSatelite);
  $("b-capa").classList.toggle("activo", aSatelite);
  mapa.removeLayer(aSatelite ? calles : satelite);
  (aSatelite ? satelite : calles).addTo(mapa);
});
$("b-ubicacion").addEventListener("click", () => {
  if (!navigator.geolocation) { avisar("Este dispositivo no permite ver la ubicación."); return; }
  avisar("Buscando su ubicación...");
  navigator.geolocation.getCurrentPosition(pos => {
    miPunto = [pos.coords.latitude, pos.coords.longitude];
    if (marcaYo) marcaYo.remove();
    marcaYo = L.marker(miPunto, { interactive: false, icon: L.divIcon({ className: "", html: '<div class="yo"></div>', iconSize: [18, 18] }) }).addTo(mapa);
    $("b-ubicacion").classList.add("activo");
    pintarLista();
    const cerca = lineas.map(l => ({ l, d: metrosA(l) })).sort((a, b) => a.d - b.d)[0];
    if (cerca && cerca.d < 5000) { avisar(`La más cercana: ${cerca.l.titulo}, a ${num(cerca.d, 0)} m.`); mapa.flyTo(miPunto, 16, { duration: calmo ? 0 : .8 }); }
    else avisar("Usted está lejos de las rutas de micros de Camiri.");
  }, () => avisar("No se pudo obtener su ubicación. Revise que esté activada y permitida."), { enableHighAccuracy: true, timeout: 12000 });
});

// instalar como aplicación (aparece solo cuando el navegador lo permite)
let ofertaInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); ofertaInstalar = e; $("b-instalar").style.display = "flex"; });
$("b-instalar").addEventListener("click", async () => { if (ofertaInstalar) { ofertaInstalar.prompt(); await ofertaInstalar.userChoice; ofertaInstalar = null; $("b-instalar").style.display = "none"; } });
window.addEventListener("appinstalled", () => { $("b-instalar").style.display = "none"; avisar("Aplicación instalada."); });

let relojTamano = null;
function alCambiarTamano() {
  clearTimeout(relojTamano);
  relojTamano = setTimeout(() => { mapa.invalidateSize(); if (!lateral.matches) ponerAltura(alturaCercana(alturaPx)); reencuadrar(false); }, 180);
}
window.addEventListener("resize", alCambiarTamano);
lateral.addEventListener("change", alCambiarTamano);

// ------------------------------------------------------------------ arranque
ponerAltura(paradas()[1]);
pintarLista();
elegir(deHash(), true);
setTimeout(() => { mapa.invalidateSize(); reencuadrar(false); $("entrada").classList.add("fuera"); }, 650);
// La guía aparece solo la primera vez que se abre la aplicación en ese teléfono.
let yaVio = false;
try { yaVio = localStorage.getItem("micros-guia-vista") === "si"; } catch (e) { /* modo privado */ }
if (!yaVio && lineas.length) setTimeout(() => $("bienvenida").classList.add("ver"), 900);
$("b-entendido").addEventListener("click", () => {
  $("bienvenida").classList.remove("ver");
  try { localStorage.setItem("micros-guia-vista", "si"); } catch (e) { /* modo privado */ }
});

// Aplicación instalable y con memoria: solo funciona cuando la página está publicada en un sitio seguro (https).
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
